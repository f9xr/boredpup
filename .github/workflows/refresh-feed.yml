name: Refresh game catalog

on:
  schedule:
    # Nightly rebuild: merge GameMonetize + GameDistribution + yupi.io feeds into the static data files.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build catalog + secondary provider
        env:
          BOREDPUP_BASE_URL: https://boredpup.com
        run: npm run build:all

      - name: Commit changes
        run: |
          git config user.name "boredpup-bot"
          git config user.email "boredpup-bot@users.noreply.github.com"
          git add data/*.json sitemap.xml
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): refresh game catalog [skip ci]"
            git push
          fi

      - name: Upload catalog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: |
            data/*.json
            sitemap.xml
          if-no-files-found: ignore